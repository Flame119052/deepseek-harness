# Reserve the installed pi-ai catalog output allowance without configuring a cap.

- id: agent-instructions
  disabled: true

- id: llm-deepseek
  disabled: true

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          openai:
            apiKeyEnv: OPENAI_API_KEY
            models:
              - id: gpt-4-turbo
                contextWindow: 11678
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'
